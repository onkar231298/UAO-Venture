<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="plateGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="powderGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#fefdf8"/>
  
  <!-- Wooden surface -->
  <rect width="400" height="100" y="200" fill="#d2b48c" opacity="0.5"/>
  
  <!-- Plate -->
  <ellipse cx="200" cy="180" rx="90" ry="80" fill="url(#plateGradient)" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Turmeric powder in bowl -->
  <ellipse cx="200" cy="165" rx="70" ry="55" fill="url(#powderGradient)"/>
  
  <!-- Wooden spoon -->
  <ellipse cx="280" cy="140" rx="25" ry="6" fill="#8b4513" transform="rotate(30 280 140)"/>
  <ellipse cx="295" cy="125" rx="8" ry="12" fill="#8b4513" transform="rotate(30 295 125)"/>
  
  <!-- Turmeric root pieces -->
  <ellipse cx="120" cy="120" rx="12" ry="4" fill="#b45309" transform="rotate(-20 120 120)"/>
  <ellipse cx="130" cy="105" rx="15" ry="5" fill="#b45309" transform="rotate(10 130 105)"/>
  
  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">
    Fresh Ground Turmeric Powder
  </text>
</svg>