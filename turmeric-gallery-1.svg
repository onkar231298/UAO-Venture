<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="turmericGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed7aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Turmeric powder pile -->
  <ellipse cx="200" cy="200" rx="80" ry="30" fill="#d97706" opacity="0.3"/>
  <ellipse cx="200" cy="190" rx="70" ry="25" fill="url(#turmericGradient)"/>
  
  <!-- Turmeric roots -->
  <ellipse cx="150" cy="120" rx="35" ry="8" fill="#b45309" transform="rotate(-15 150 120)"/>
  <ellipse cx="250" cy="130" rx="40" ry="10" fill="#b45309" transform="rotate(20 250 130)"/>
  <ellipse cx="320" cy="160" rx="30" ry="7" fill="#b45309" transform="rotate(-10 320 160)"/>
  
  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#92400e">
    Premium Organic Turmeric
  </text>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b45309">
    High Curcumin Content
  </text>
</svg>