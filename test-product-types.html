<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Types API Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .product-card { border: 1px solid #eee; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .type-badge { display: inline-block; padding: 4px 8px; margin: 2px; border-radius: 12px; font-size: 12px; }
        .organic { background: #10B981; color: white; }
        .conventional { background: #3B82F6; color: white; }
        .wild-crafted { background: #8B5A2B; color: white; }
        .primary { font-weight: bold; border: 2px solid gold; }
        button { margin: 5px; padding: 8px 16px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        button:hover { background: #f5f5f5; }
        .active { background: #007bff; color: white; }
    </style>
</head>
<body>
    <h1>🧪 Product Types System Test</h1>
    
    <div class="section">
        <h2>📊 Available Product Types</h2>
        <div id="product-types"></div>
    </div>
    
    <div class="section">
        <h2>🔍 Filter Products by Type</h2>
        <div id="filter-buttons"></div>
        <div id="filtered-products"></div>
    </div>
    
    <div class="section">
        <h2>🎯 Sample Product with Types</h2>
        <div id="sample-product"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        // Load and display product types
        async function loadProductTypes() {
            try {
                const response = await fetch(`${API_BASE}/product-types`);
                const types = await response.json();
                
                const container = document.getElementById('product-types');
                container.innerHTML = types.map(type => `
                    <div style="margin: 10px 0; padding: 10px; border: 1px solid #eee; border-radius: 5px;">
                        <strong>${type.name}</strong> (${type.slug})
                        <br><small>${type.description}</small>
                        <br><span class="type-badge ${type.slug}">${type.name}</span>
                        <small style="color: #666;">Order: ${type.displayOrder}</small>
                    </div>
                `).join('');
                
                // Create filter buttons
                createFilterButtons(types);
                
            } catch (error) {
                console.error('Error loading product types:', error);
                document.getElementById('product-types').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        function createFilterButtons(types) {
            const container = document.getElementById('filter-buttons');
            const buttons = [
                { text: 'All Products', slug: '' },
                ...types.map(type => ({ text: type.name, slug: type.slug }))
            ];
            
            container.innerHTML = buttons.map(btn => 
                `<button onclick="filterProducts('${btn.slug}')" id="btn-${btn.slug}">${btn.text}</button>`
            ).join('');
        }
        
        // Filter products by type
        async function filterProducts(typeSlug) {
            // Update active button
            document.querySelectorAll('#filter-buttons button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${typeSlug}`).classList.add('active');
            
            try {
                const url = typeSlug ? 
                    `${API_BASE}/products?productType=${typeSlug}&limit=10` : 
                    `${API_BASE}/products?limit=10`;
                    
                const response = await fetch(url);
                const data = await response.json();
                
                const container = document.getElementById('filtered-products');
                if (data.products && data.products.length > 0) {
                    container.innerHTML = `
                        <h3>Found ${data.total} products ${typeSlug ? `with type "${typeSlug}"` : 'total'}</h3>
                        ${data.products.map(product => `
                            <div class="product-card">
                                <strong>${product.name}</strong>
                                <br><small>ID: ${product.productId}</small>
                                <br><small>Legacy Type: ${product.productType || 'None'}</small>
                                <br><button onclick="loadProductTypes(${product.id})">Load Types</button>
                            </div>
                        `).join('')}
                    `;
                } else {
                    container.innerHTML = `<p>No products found for type "${typeSlug}"</p>`;
                }
                
            } catch (error) {
                console.error('Error filtering products:', error);
                document.getElementById('filtered-products').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Load product types for a specific product
        async function loadProductTypes(productId) {
            try {
                const response = await fetch(`${API_BASE}/products/${productId}/types`);
                const types = await response.json();
                
                console.log(`Product ${productId} types:`, types);
                alert(`Product ${productId} has ${types.length} types: ${types.map(t => `${t.name}${t.isPrimary ? ' (PRIMARY)' : ''}`).join(', ')}`);
                
            } catch (error) {
                console.error('Error loading product types:', error);
                alert(`Error loading types: ${error.message}`);
            }
        }
        
        // Load sample product with types (Product ID 968)
        async function loadSampleProduct() {
            try {
                const response = await fetch(`${API_BASE}/products/968/types`);
                const types = await response.json();
                
                const container = document.getElementById('sample-product');
                container.innerHTML = `
                    <h3>Product ID 968 - Organic Graviola Leaf Powder</h3>
                    <p><strong>Product Types:</strong></p>
                    ${types.map(type => `
                        <span class="type-badge ${type.slug} ${type.isPrimary ? 'primary' : ''}">
                            ${type.name} ${type.isPrimary ? '⭐' : ''}
                        </span>
                    `).join('')}
                    <br><br>
                    <small>Total types: ${types.length}</small>
                `;
                
            } catch (error) {
                console.error('Error loading sample product:', error);
                document.getElementById('sample-product').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Initialize the page
        async function init() {
            await loadProductTypes();
            await loadSampleProduct();
            // Load all products initially
            filterProducts('');
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
